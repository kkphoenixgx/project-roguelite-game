<div id="confirmation-modal-overlay" class="cm-overlay is-hidden" aria-hidden="true">
    <div class="cm-backdrop"></div>
    <div class="cm-dialog" role="dialog" aria-modal="true" aria-labelledby="cm-title" aria-describedby="cm-message">
        <div class="cm-header">
            <div class="cm-icon-container" id="cm-icon-container"></div>
            <h2 id="cm-title" class="cm-title">Atenção</h2>
        </div>
        <div class="cm-body">
            <p id="cm-message" class="cm-message"></p>
        </div>
        <div class="cm-actions" id="cm-actions">
            <button id="cm-btn-cancel" class="cm-btn cm-btn-secondary" type="button">Cancelar</button>
            <button id="cm-btn-confirm" class="cm-btn cm-btn-primary" type="button">Confirmar</button>
        </div>
    </div>
</div>
