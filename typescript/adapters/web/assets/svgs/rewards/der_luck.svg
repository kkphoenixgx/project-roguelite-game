<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="clover_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55efc4"/>
      <stop offset="40%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#006241"/>
    </linearGradient>
    <filter id="luck_glow">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00b894" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Trevo de 4 Folhas Nobre -->
  <g filter="url(#luck_glow)">
    <!-- Talo Curvado Descendente -->
    <path d="M24 24 C24 34 20 40 16 43 C15 43 14 42 15 41 C18 38 21 33 22 24 Z" fill="#00b894" stroke="#004d30" stroke-width="1"/>
    <!-- Folha Superior (Norte) -->
    <path d="M24 24 C17 17 15 6 24 10 C33 6 31 17 24 24 Z" fill="url(#clover_grad)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M24 24 V12" stroke="#55efc4" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Folha Inferior (Sul) -->
    <path d="M24 24 C17 31 15 42 24 38 C33 42 31 31 24 24 Z" fill="url(#clover_grad)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M24 24 V36" stroke="#55efc4" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Folha Esquerda (Oeste) -->
    <path d="M24 24 C17 17 6 15 10 24 C6 33 17 31 24 24 Z" fill="url(#clover_grad)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M24 24 H12" stroke="#55efc4" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Folha Direita (Leste) -->
    <path d="M24 24 C31 17 42 15 38 24 C42 33 31 31 24 24 Z" fill="url(#clover_grad)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M24 24 H36" stroke="#55efc4" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Núcleo de Fortuna Dourada -->
    <circle cx="24" cy="24" r="3" fill="#fed330" stroke="#ffffff" stroke-width="1"/>
    <!-- Centelhas de Sorte -->
    <path d="M10 10 L12 12 M38 10 L36 12 M10 38 L12 36 M38 38 L36 36" stroke="#fed330" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
