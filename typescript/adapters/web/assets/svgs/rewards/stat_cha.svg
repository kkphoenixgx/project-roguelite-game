    <path d="M10 16 C12 24 16 32 24 34 C32 32 36 24 38 16 C34 14 28 18 24 18 C20 18 14 14 10 16 Z" fill="url(#mask_grad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
