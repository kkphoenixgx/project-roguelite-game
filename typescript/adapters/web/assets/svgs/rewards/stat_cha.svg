<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="mask_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ff3"/>
      <stop offset="60%" stop-color="#f368e0"/>
      <stop offset="100%" stop-color="#9b59b6"/>
    </linearGradient>
    <filter id="cha_glow">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#f368e0" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Máscara Nobre de Baile / Fascínio e Presença Magnética -->
