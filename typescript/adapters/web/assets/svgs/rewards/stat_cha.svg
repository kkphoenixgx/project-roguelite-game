    <polygon points="24,10 26,14 24,18 22,14" fill="#fed330" stroke="#ffffff" stroke-width="0.8"/>
    <path d="M24 10 Q28 6 32 8 Q28 12 24 10 Z" fill="#ffffff" opacity="0.8"/>
    <!-- Faíscas de Charme e Atração Magnética -->
