<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="crit_c_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="60%" stop-color="#d63031"/>
      <stop offset="100%" stop-color="#630000"/>
    </linearGradient>
    
  </defs>
  <g>
    <!-- Círculo Exterior da Mira -->
    <circle cx="24" cy="24" r="16" fill="none" stroke="#d63031" stroke-width="2"/>
    <!-- Círculo Interno com Ponto Crítico -->
    <circle cx="24" cy="24" r="8" fill="#2d3436" stroke="#ff7675" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="3" fill="#ffffff"/>
    <!-- Linhas da Mira Telescópica -->
    <line x1="24" y1="4" x2="24" y2="12" stroke="#ff7675" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="36" x2="24" y2="44" stroke="#ff7675" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="24" x2="12" y2="24" stroke="#ff7675" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="24" x2="44" y2="24" stroke="#ff7675" stroke-width="2" stroke-linecap="round"/>
    <!-- Marcas triangulares de precisão -->
    <polygon points="24,14 26,17 22,17" fill="#ff7675"/>
    <polygon points="24,34 26,31 22,31" fill="#ff7675"/>
    <polygon points="14,24 17,26 17,22" fill="#ff7675"/>
    <polygon points="34,24 31,26 31,22" fill="#ff7675"/>
  </g>
</svg>
