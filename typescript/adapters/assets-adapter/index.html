<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assets Adapter — Editor de Cenários e Mapas</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header id="top-navbar">
        <div class="nav-left">
            <span class="app-logo" title="Assets Adapter">🗺️</span>

            <nav id="editor-menu-bar" class="menu-bar" aria-label="Menu do editor">
                <div class="menu-root">
                    <button type="button" class="menu-trigger" aria-haspopup="true" aria-expanded="false">Arquivo</button>
                    <div class="menu-dropdown" role="menu">
                        <button type="button" role="menuitem" class="menu-item" id="btn-menu-new-map">
                            <span class="menu-item-icon">➕</span><span class="menu-item-label">Novo Mapa...</span>
                        </button>
                        <button type="button" role="menuitem" class="menu-item" id="btn-quick-change-map">
                            <span class="menu-item-icon">🗺️</span><span class="menu-item-label">Abrir Mapa...</span>
                        </button>
                        <div class="menu-separator" role="separator"></div>
                        <button type="button" role="menuitem" class="menu-item" id="btn-quick-export-image" title="Exportar o canvas atual como imagem PNG limpa de fundo (sem hitboxes ou objetos adicionais)">
                            <span class="menu-item-icon">📸</span><span class="menu-item-label">Exportar Fundo (PNG)</span>
                        </button>
                        <button type="button" role="menuitem" class="menu-item" id="btn-quick-export" title="Ver/copiar o código gerado do cenário">
                            <span class="menu-item-icon">📋</span><span class="menu-item-label">Exportar Código do Cenário...</span>
                        </button>
                    </div>
                </div>

                <div class="menu-root">
                    <button type="button" class="menu-trigger" aria-haspopup="true" aria-expanded="false">Mapa</button>
                    <div class="menu-dropdown" role="menu">
                        <button type="button" role="menuitem" class="menu-item" id="btn-manage-chunks" title="Adicionar/remover chunks, trocar imagens de fundo e gerenciar InnerMaps">
                            <span class="menu-item-icon">🧱</span><span class="menu-item-label">Chunks e Fundo...</span>
                        </button>
                        <button type="button" role="menuitem" class="menu-item" id="btn-open-sprite-modal">
                            <span class="menu-item-icon">✨</span><span class="menu-item-label">Definir Novo Sprite...</span>
                        </button>
                    </div>
                </div>

                <div class="menu-root">
                    <button type="button" class="menu-trigger" aria-haspopup="true" aria-expanded="false">Exibir</button>
                    <div class="menu-dropdown" role="menu">
                        <button type="button" role="menuitemcheckbox" class="menu-item menu-item-toggle" id="btn-quick-toggle-hitboxes" title="Mostrar as hitboxes de colisão dos assets no mapa">
                            <span class="menu-item-check">✓</span><span class="menu-item-label" id="hitbox-status-text">Hitboxes</span><span class="menu-item-shortcut">F2</span>
                        </button>
                        <button type="button" role="menuitemcheckbox" class="menu-item menu-item-toggle active" id="btn-quick-toggle-player-ref" title="Mostrar a referência de tamanho do Player Idle">
                            <span class="menu-item-check">✓</span><span class="menu-item-label" id="player-ref-text">Referência do Player</span><span class="menu-item-shortcut">P</span>
                        </button>
                    </div>
                </div>

                <div class="menu-root">
                    <button type="button" class="menu-trigger" aria-haspopup="true" aria-expanded="false">Ferramentas</button>
                    <div class="menu-dropdown" role="menu">
                        <button type="button" role="menuitemcheckbox" class="menu-item menu-item-toggle" id="btn-quick-toggle-snap" title="Encaixe na grade (snap to grid) para posicionamento alinhado">
                            <span class="menu-item-check">✓</span><span class="menu-item-label" id="snap-status-text">Encaixe na Grade</span>
                        </button>
                        <div class="menu-separator" role="separator"></div>
                        <button type="button" role="menuitemcheckbox" class="menu-item menu-item-toggle" id="btn-quick-stamp-mode" title="Modo carimbo / pincel contínuo de assets">
                            <span class="menu-item-check">✓</span><span class="menu-item-label" id="stamp-status-text">Modo Carimbo</span><span class="menu-item-shortcut">B</span>
                        </button>
                        <button type="button" role="menuitemcheckbox" class="menu-item menu-item-toggle" id="btn-quick-chunk-brush" title="Pincel de textura de chunk para pintar terrenos (pronto para Bake)">
                            <span class="menu-item-check">✓</span><span class="menu-item-label" id="chunk-brush-status-text">Pincel de Chunk</span><span class="menu-item-shortcut">T</span>
                        </button>
                    </div>
                </div>
            </nav>
        </div>

        <h1 class="menu-bar-title">Assets Adapter</h1>

        <div class="nav-right">
            <div id="active-modes-indicator" class="active-modes-indicator" aria-live="polite"></div>
            <div id="sync-status-badge" class="sync-status-badge saved" title="Status de sincronização direta com o arquivo do mundo">
                <span class="sync-dot"></span>
                <span id="sync-status-text">✓ Sincronizado com VilgemWorld.ts</span>
            </div>
        </div>
    </header>

    <main id="app-workspace">
        <!-- Botão lateral para reabrir a gaveta quando estiver fechada -->
        <button id="btn-reopen-drawer" class="btn-sidebar-open-tab" title="Expandir Biblioteca de Assets" style="display: none;">
            <span class="open-tab-icon">📁</span>
            <span class="open-tab-label">Assets</span>
            <span class="open-tab-arrow">❯</span>
        </button>

        <!-- 1. Coluna Esquerda: Gaveta de Assets Dinâmica (Drag & Drop + Scroll + Fechar) -->
        <aside id="asset-drawer" class="asset-drawer"></aside>

        <!-- Divisor Redimensionável Esquerdo (Splitter/Resizer) -->
        <div id="drawer-resizer" class="panel-resizer resizer-left" title="Arrastar para redimensionar (Duplo clique para redefinir)">
            <div class="resizer-handle-grip"></div>
        </div>

        <!-- 2. Área Central: Mapa Gerado pelo Adaptador Web -->
        <section id="canvas-container" class="canvas-container"></section>

        <!-- Divisor Redimensionável Direito (Splitter/Resizer) -->
        <div id="props-resizer" class="panel-resizer resizer-right" title="Arrastar para redimensionar (Duplo clique para redefinir)">
            <div class="resizer-handle-grip"></div>
        </div>

        <!-- 3. Coluna Direita: Painel de Propriedades (sprites, configurações...) -->
        <aside id="properties-panel" class="properties-panel"></aside>
    </main>

    <script type="module" src="./EditorApp.ts"></script>
</body>
</html>
